<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the felt runs under the notch; belote.css pads with safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Added to the home screen, the table opens full screen without Safari's bars. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Belote" />
    <meta name="color-scheme" content="light dark" />
    <!-- A spade on felt: the one mark that survives 16px, which is the size that actually
         decides a favicon. SVG for the tab; iOS ignores an SVG icon entirely and falls back
         to a screenshot of the page, hence the PNG too. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The felt: the page is dark green in every scheme, so one theme-color is enough. -->
    <meta name="theme-color" content="#0a3a24" />
    <title>Belote</title>
    <meta
      name="description"
      content="La belote entre amis, en ligne. Classique ou coinchée. / Belote with friends, online."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
